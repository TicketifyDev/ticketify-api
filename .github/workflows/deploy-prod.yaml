name: Production Deployment

on:
  push:
    branches:
      - T-PROD

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:

      - name: Deploy to EC2

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/ticketify

            docker compose pull

            docker compose up -d